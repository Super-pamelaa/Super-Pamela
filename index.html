<!DOCTYPE html>
<html lang="es-UY">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Panel · Super Pamela</title>
<style>
:root{--blue:#072a68;--blue2:#0b3d91;--red:#d61f26;--sky:#e8f0fc;--ink:#14213d;--mut:#5b6578;--line:#dbe2ef;--bg:#f3f6fb}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}h1,h2,h3{margin:0}
:focus-visible{outline:3px solid #ffb703;outline-offset:2px}
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;background:var(--blue2);color:#fff}
.btn.red{background:var(--red)}.btn.ghost{background:#fff;color:var(--blue2);border:1px solid var(--line)}.btn.sm{padding:5px 10px;font-size:.85rem}.btn[disabled]{opacity:.6}
#login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),var(--blue2));padding:18px}
.box{background:#fff;border-radius:18px;padding:28px;width:min(400px,100%);display:grid;gap:12px}
.box img{height:60px;justify-self:center;border-radius:8px;background:var(--blue)}
label{display:grid;gap:4px;font-weight:700;font-size:.9rem}
input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;background:#fff}
.err{color:var(--red);font-weight:700;min-height:1.2em;font-size:.9rem}
.app{display:none;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--blue);color:#fff;padding:16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
aside img{height:48px;border-radius:8px;margin-bottom:10px;align-self:flex-start}
aside button{background:none;border:0;color:#dbe6ff;text-align:left;padding:11px 12px;border-radius:10px;font-weight:700;cursor:pointer}
aside button.on,aside button:hover{background:rgba(255,255,255,.14);color:#fff}
aside button.on{box-shadow:inset 4px 0 0 var(--red)}
aside .sp{flex:1}aside a{color:#dbe6ff;font-size:.9rem;padding:6px 12px}
main{padding:22px;min-width:0}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.hd h2{color:var(--blue);font-size:1.6rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.st{background:#fff;border-radius:14px;padding:16px;border-top:4px solid var(--blue2)}.st.r{border-color:var(--red)}
.st b{display:block;font-size:1.8rem;color:var(--blue)}.st span{color:var(--mut);font-size:.88rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.pn{background:#fff;border-radius:14px;padding:16px}.pn h3{font-size:1.05rem;margin-bottom:10px;color:var(--blue)}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.75rem;color:var(--mut)}
.bars i{display:block;width:100%;background:var(--blue2);border-radius:6px 6px 0 0;min-height:2px}.bars b{color:var(--ink)}
.hb{display:grid;grid-template-columns:110px 1fr 28px;gap:8px;align-items:center;margin:7px 0;font-size:.9rem}
.hb i{display:block;height:12px;background:var(--red);border-radius:6px}
.tw{background:#fff;border-radius:14px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.8rem;text-transform:uppercase;color:var(--mut);background:#f8fafd}
.th{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--sky);display:block;margin-bottom:6px}
td .th{margin:0}.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:800;background:var(--sky);color:var(--blue2)}
.tag.no{background:#ffe4e5;color:var(--red)}
.ord{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;display:grid;gap:8px;border-left:6px solid var(--blue2)}
.ord ul{margin:0;padding-left:18px}.ord .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.ord .wa{background:#1fa855}.mut{color:var(--mut);font-size:.88rem}
.empty{text-align:center;color:var(--mut);padding:36px}
.sf{background:#fff;border-radius:14px;padding:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;max-width:960px}
.sf .w{grid-column:1/-1}
dialog{border:0;border-radius:16px;padding:0;width:min(520px,94vw);max-height:92vh}dialog::backdrop{background:rgba(7,20,50,.55)}
#frm{padding:20px;display:grid;gap:12px}#frm h3{color:var(--blue)}
.ck{display:flex;align-items:center;gap:8px}.ck input{width:auto}
.acts{display:flex;gap:8px;justify-content:flex-end}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--blue);color:#fff;padding:11px 20px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;max-width:92vw}
#toast.on{opacity:1}#toast.bad{background:var(--red)}
@media(max-width:820px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}aside .sp,aside a{display:none}aside img{margin:0 8px 0 0}main{padding:14px}}
</style>
</head>
<body>

<div id="login">
  <form class="box" id="lf">
    <img src="../logo.png" alt="Super Pamela">
    <h2 style="text-align:center;color:var(--blue)">Panel de administración</h2>
    <label>Correo electrónico<input type="email" id="em" required autocomplete="username"></label>
    <label>Contraseña<input type="password" id="pw" required autocomplete="current-password"></label>
    <div class="err" id="lerr" role="alert"></div>
    <button class="btn red" id="lb">Ingresar</button>
  </form>
</div>

<div class="app" id="app">
  <aside>
    <img src="../logo.png" alt="Super Pamela">
    <button data-v="dash">📊 Panel</button><button data-v="prod">📦 Productos</button><button data-v="offers">🏷️ Ofertas</button><button data-v="orders">🧾 Pedidos</button><button data-v="conf">⚙️ Configuración</button>
    <div class="sp"></div><a href="../" target="_blank">Ver página pública ↗</a><button id="out">Cerrar sesión</button>
  </aside>
  <main id="main"></main>
</div>

<dialog id="dlg"><form id="frm"></form></dialog>
<div id="toast" role="status"></div>

<script src="../config.js"></script>
<script>
window.SB_URL=(String(window.SB_URL||"").match(/https?:\/\/[A-Za-z0-9.-]+/)||[String(window.SB_URL||"").replace(/[\s"']/g,"")])[0].replace(/\/+$/,"");window.__x=String(window.SB_URL||"").replace(/[\s"']/g,"").replace(/\/+$/,"").replace(/\/(rest|auth)\/v1$/,"");window.SB_KEY=String(window.SB_KEY||"").replace(/[\s"']/g,"");
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>"$"+Math.round(n||0).toLocaleString("es-UY");
const DEFCATS="🥩 Carnicería\n🧀 Fiambrería\n🍎 Frutas y verduras\n🍚 Almacén\n🥛 Lácteos\n🍞 Panadería\n🥤 Bebidas\n🧊 Congelados\n🧽 Limpieza\n🧴 Higiene personal";
const STATES=["pendiente","confirmado","en preparación","entregado","cancelado"],UNITS=["unidad","kg","litro","paquete","combo"];
let toastT;function toast(m,bad){const t=$("#toast");t.textContent=m;t.className="on"+(bad?" bad":"");clearTimeout(toastT);toastT=setTimeout(()=>t.className="",3200)}
if(!window.SB_URL||!window.SB_KEY){$("#lerr").textContent="Falta completar SB_URL y SB_KEY en config.js.";$("#lb").disabled=true}
$("#lf").addEventListener("submit",e=>e.preventDefault());
/* Conexión directa con Supabase (sin librerías externas) */
let SESSION=null;try{SESSION=JSON.parse(localStorage.getItem("sp-session")||"null")}catch(e){}
function setSess(j){SESSION=j&&j.access_token?{access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600)}:null;try{SESSION?localStorage.setItem("sp-session",JSON.stringify(SESSION)):localStorage.removeItem("sp-session")}catch(e){}}
const hdr=(x={})=>({apikey:SB_KEY,Authorization:"Bearer "+(SESSION?SESSION.access_token:SB_KEY),...x});
async function refresh(){if(!SESSION||SESSION.expires_at*1000-Date.now()>60000)return;
  try{const r=await fetch(SB_URL+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:SESSION.refresh_token})});setSess(r.ok?await r.json():null)}catch(e){}}
class QB{constructor(t){this.t=t;this.m="GET";this.p=new URLSearchParams();this.body=null;this.pf=[]}
  select(c){this.p.set("select",c||"*");return this}
  order(c,o={}){this.p.set("order",c+(o.ascending===false?".desc":".asc"));return this}
  eq(c,v){this.p.append(c,"eq."+v);return this}
  limit(n){this.p.set("limit",n);return this}
  insert(b){this.m="POST";this.body=b;return this}
  update(b){this.m="PATCH";this.body=b;return this}
  delete(){this.m="DELETE";return this}
  upsert(b){this.m="POST";this.body=b;this.pf.push("resolution=merge-duplicates");return this}
  then(ok,no){return this.run().then(ok,no)}
  async run(){try{await refresh();const h=hdr({"Content-Type":"application/json"});if(this.pf.length)h.Prefer=this.pf.join(",");
    const r=await fetch(SB_URL+"/rest/v1/"+this.t+"?"+this.p,{method:this.m,headers:h,body:this.body?JSON.stringify(this.body):undefined});
    const tx=await r.text();let j=null;try{j=tx?JSON.parse(tx):null}catch(e){}
    if(!r.ok)return{data:null,error:{message:(j&&(j.message||j.msg))||("Error "+r.status)}};
    return{data:this.m==="GET"?j:null,error:null}}catch(e){return{data:null,error:{message:"No se pudo conectar con «"+SB_URL+"». Esa dirección no responde: revisá que sea idéntica a la de Supabase."}}}}}
const sb={
  auth:{
    async signInWithPassword({email,password}){try{const r=await fetch(SB_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password})});const j=await r.json();if(!r.ok)return{error:{message:j.error_description||j.msg||j.message||"Error "+r.status}};setSess(j);return{error:null}}catch(e){return{error:{message:"No se pudo conectar con «"+SB_URL+"». Esa dirección no responde: revisá que sea idéntica a la de Supabase."}}}},
    async getSession(){await refresh();return{data:{session:SESSION}}},
    async signOut(){setSess(null)}},
  from:t=>new QB(t),
  storage:{from:b=>({
    async upload(path,file,o){await refresh();try{const r=await fetch(SB_URL+"/storage/v1/object/"+b+"/"+path,{method:"POST",headers:hdr({"Content-Type":(o&&o.contentType)||file.type}),body:file});if(!r.ok){let m="Error "+r.status;try{m=(await r.json()).message||m}catch(e){}return{error:{message:m}}}return{error:null}}catch(e){return{error:{message:e.message}}}},
    getPublicUrl:path=>({data:{publicUrl:SB_URL+"/storage/v1/object/public/"+b+"/"+path}})})}};
if(window.SB_URL&&window.SB_KEY)sb.auth.getSession().then(({data})=>{if(data.session)enter()});
let D={products:[],offers:[],orders:[],conf:{}},V="dash";
async function q(p){const r=await p;if(r.error)throw new Error(r.error.message);return r.data}

/* ---- acceso ---- */
$("#lf").onsubmit=async e=>{e.preventDefault();if(!window.SB_URL||!window.SB_KEY)return;$("#lb").disabled=true;$("#lerr").textContent="Ingresando…";
  const {error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
  try{if(error)$("#lerr").textContent=/confirm/i.test(error.message)?"Falta confirmar el correo (confirmalo en Supabase > Authentication > Users).":/invalid login/i.test(error.message)?"Correo o contraseña incorrectos.":"Error: "+error.message;else{$("#lerr").textContent="";await enter()}}catch(er){$("#lerr").textContent="Error: "+er.message}$("#lb").disabled=false};
async function enter(){
  const {data}=await sb.from("admins").select("email").limit(1);
  if(!data||!data.length){await sb.auth.signOut();$("#lerr").textContent="Esta cuenta no tiene permisos de administrador.";return}
  $("#login").style.display="none";$("#app").style.display="grid";await load();render()}
$("#out").onclick=async()=>{await sb.auth.signOut();location.reload()};

async function load(){try{
  const [p,o,r,s]=await Promise.all([q(sb.from("products").select("*").order("name")),q(sb.from("offers").select("*").order("created_at",{ascending:false})),q(sb.from("orders").select("*").order("created_at",{ascending:false})),q(sb.from("settings").select("data").eq("id",1))]);
  D={products:p,offers:o,orders:r,conf:(s[0]&&s[0].data)||{}}}catch(e){toast("No se pudieron cargar los datos: "+e.message,1)}}
document.querySelectorAll("aside [data-v]").forEach(b=>b.onclick=()=>{V=b.dataset.v;render()});

/* ---- formularios genéricos ---- */
function formHTML(fields,v){return fields.map(([k,l,t,o])=>{const x=v[k]??"";
  if(t==="checkbox")return `<label class="ck"><input type="checkbox" name="${k}" ${x?"checked":""}> ${l}</label>`;
  let i;if(t==="textarea")i=`<textarea name="${k}" rows="${o&&o.rows||3}">${esc(x)}</textarea>`;
  else if(t==="select")i=`<select name="${k}">${o.map(z=>`<option ${z===x?"selected":""}>${esc(z)}</option>`).join("")}</select>`;
  else if(t==="image")i=(x?`<img class="th" src="${esc(x)}" alt="">`:"")+`<input type="file" name="${k}" accept="image/*">`;
  else i=`<input name="${k}" type="${t}" value="${esc(x)}" ${o&&o.req?"required":""} ${t==="number"?'step="any" min="0"':""}>`;
  return `<label class="${o&&o.w?"w":""}">${l}${i}</label>`}).join("")}
async function upload(f){if(f.size>3e6)throw new Error("La imagen supera 3 MB.");
  const path=Date.now()+"-"+Math.random().toString(36).slice(2,8)+"."+(f.name.split(".").pop()||"jpg").toLowerCase();
  const {error}=await sb.storage.from("images").upload(path,f,{contentType:f.type});if(error)throw new Error(error.message);
  return sb.storage.from("images").getPublicUrl(path).data.publicUrl}
async function collect(f,fields,v){const o={};for(const [k,,t] of fields){const el=f.elements[k];
  if(t==="checkbox")o[k]=el.checked;else if(t==="image"){o[k]=v[k]||null;if(el.files[0])o[k]=await upload(el.files[0])}
  else if(t==="number")o[k]=el.value===""?null:Number(el.value);else o[k]=el.value.trim()||(t==="date"?null:"")}return o}
function openForm(title,fields,v,save){const d=$("#dlg"),f=$("#frm");
  f.innerHTML=`<h3>${title}</h3>`+formHTML(fields,v)+`<div class="acts"><button type="button" class="btn ghost" id="cx">Cancelar</button><button class="btn red">Guardar</button></div>`;
  $("#cx").onclick=()=>d.close();
  f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector(".red");b.disabled=true;
    try{await save(await collect(f,fields,v));await load();render();d.close();toast("Guardado correctamente ✔")}catch(er){toast("Error: "+er.message,1)}b.disabled=false};
  d.showModal()}
async function del(t,id,name){if(!confirm("¿Eliminar «"+name+"»? Esta acción no se puede deshacer."))return;
  try{await q(sb.from(t).delete().eq("id",id));await load();render();toast("Eliminado ✔")}catch(e){toast("Error: "+e.message,1)}}
async function patch(t,id,o){try{await q(sb.from(t).update(o).eq("id",id));await load();render()}catch(e){toast("Error: "+e.message,1);render()}}
const cats=()=>(D.conf.categorias||DEFCATS).split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^(\S+)\s+(.+)$/);return m?m[2]:l});
const waNum=p=>{let d=String(p).replace(/\D/g,"");if(d.startsWith("0"))d="598"+d.slice(1);return d};

/* ---- vistas ---- */
function render(){document.querySelectorAll("aside [data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v===V));
  $("#main").innerHTML=({dash,prod,offers,orders,conf})[V]();bind()}
function dash(){const P=D.products,O=D.orders,today=new Date().toISOString().slice(0,10);
  const act=D.offers.filter(o=>o.active&&(!o.starts_on||o.starts_on<=today)&&(!o.ends_on||o.ends_on>=today)).length;
  const sales=O.filter(o=>o.status==="entregado").reduce((s,o)=>s+Number(o.total),0);
  const S=[["Productos",P.length],["Publicados",P.filter(p=>p.active).length],["Sin stock",P.filter(p=>p.stock===0).length,1],["Ofertas activas",act],["Pedidos recibidos",O.length],["Ventas (pedidos entregados)",money(sales),1]];
  const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d.toLocaleDateString("en-CA")});
  const cnt=days.map(d=>O.filter(o=>new Date(o.created_at).toLocaleDateString("en-CA")===d).length),mx=Math.max(1,...cnt);
  const bs=STATES.map(s=>[s,O.filter(o=>o.status===s).length]),mb=Math.max(1,...bs.map(x=>x[1]));
  return `<div class="hd"><h2>Panel principal</h2></div><div class="stats">${S.map(s=>`<div class="st ${s[2]?"r":""}"><b>${s[1]}</b><span>${s[0]}</span></div>`).join("")}</div>
  <div class="cards"><div class="pn"><h3>Pedidos de los últimos 7 días</h3><div class="bars">${cnt.map((c,i)=>`<div><b>${c}</b><i style="height:${c/mx*100}%"></i>${days[i].slice(5)}</div>`).join("")}</div></div>
  <div class="pn"><h3>Pedidos por estado</h3>${bs.map(([s,c])=>`<div class="hb"><span>${s}</span><i style="width:${c/mb*100}%"></i><b>${c}</b></div>`).join("")}</div></div>`}
const PF=()=>[["name","Nombre","text",{req:1}],["category","Categoría","select",cats()],["price","Precio ($ UYU)","number",{req:1}],["unit","Unidad de venta","select",UNITS],["stock","Stock disponible (vacío = sin control)","number"],["description","Descripción","textarea"],["image_url","Fotografía","image"],["featured","⭐ Producto destacado","checkbox"],["active","Publicado en la página","checkbox"]];
function prod(){return `<div class="hd"><h2>Productos</h2><button class="btn red" data-new="p">+ Nuevo producto</button></div>
  <div class="tw"><table><thead><tr><th>Producto</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Publicado</th><th>Destacado</th><th></th></tr></thead><tbody>${D.products.map(p=>`<tr><td><div style="display:flex;gap:10px;align-items:center">${p.image_url?`<img class="th" src="${esc(p.image_url)}" alt="">`:`<span class="th"></span>`}<b>${esc(p.name)}</b></div></td><td>${esc(p.category)}</td><td>${money(p.price)} / ${esc(p.unit)}</td><td>${p.stock===null?'<span class="mut">sin control</span>':p.stock===0?'<span class="tag no">Sin stock</span>':p.stock}</td><td><input type="checkbox" data-t="products" data-id="${p.id}" data-k="active" ${p.active?"checked":""} aria-label="Publicado"></td><td><input type="checkbox" data-t="products" data-id="${p.id}" data-k="featured" ${p.featured?"checked":""} aria-label="Destacado"></td><td style="white-space:nowrap"><button class="btn sm ghost" data-edit="p" data-id="${p.id}">Editar</button> <button class="btn sm red" data-del="p" data-id="${p.id}">Eliminar</button></td></tr>`).join("")||`<tr><td colspan="7" class="empty">Todavía no hay productos. Tocá «Nuevo producto» para cargar el primero.</td></tr>`}</tbody></table></div>`}
const OF=[["title","Título","text",{req:1}],["tag","Etiqueta (ej: -20%, Combo)","text"],["description","Descripción","textarea"],["price","Precio nuevo ($)","number",{req:1}],["old_price","Precio anterior ($)","number"],["unit","Unidad","select",UNITS],["emoji","Emoji (si no hay foto)","text"],["image_url","Imagen","image"],["starts_on","Fecha de inicio","date"],["ends_on","Fecha de finalización","date"],["featured","⭐ Destacar primero en la página","checkbox"],["active","Activa","checkbox"]];
function offers(){return `<div class="hd"><h2>Ofertas</h2><button class="btn red" data-new="o">+ Nueva oferta</button></div>
  <div class="tw"><table><thead><tr><th>Oferta</th><th>Precio</th><th>Vigencia</th><th>Activa</th><th>Destacada</th><th></th></tr></thead><tbody>${D.offers.map(o=>`<tr><td><b>${esc(o.title)}</b><br><span class="tag">${esc(o.tag)}</span></td><td>${money(o.price)} ${o.old_price?`<s class="mut">${money(o.old_price)}</s>`:""}</td><td class="mut">${o.starts_on||"—"} → ${o.ends_on||"sin fin"}</td><td><input type="checkbox" data-t="offers" data-id="${o.id}" data-k="active" ${o.active?"checked":""} aria-label="Activa"></td><td><input type="checkbox" data-t="offers" data-id="${o.id}" data-k="featured" ${o.featured?"checked":""} aria-label="Destacada"></td><td style="white-space:nowrap"><button class="btn sm ghost" data-edit="o" data-id="${o.id}">Editar</button> <button class="btn sm red" data-del="o" data-id="${o.id}">Eliminar</button></td></tr>`).join("")||`<tr><td colspan="6" class="empty">No hay ofertas creadas.</td></tr>`}</tbody></table></div>`}
function orders(){return `<div class="hd"><h2>Pedidos</h2></div>`+(D.orders.map(o=>`<div class="ord"><div class="top"><div><b>${esc(o.customer_name)}</b> · <span class="mut">${esc(o.customer_phone)}</span><br><span class="mut">${new Date(o.created_at).toLocaleString("es-UY")}</span></div><div style="display:flex;gap:8px;align-items:center"><select data-os="${o.id}" aria-label="Estado" style="width:auto">${STATES.map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select><a class="btn sm wa" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/${waNum(o.customer_phone)}?text=${encodeURIComponent("Hola "+o.customer_name+", te escribimos de Super Pamela por tu pedido.")}">WhatsApp</a></div></div><ul>${(o.items||[]).map(i=>`<li>${esc(i.name)} — ${esc(i.qty)} ${esc(i.unit==="kg"?"kg":"×")} (${money(i.price)}/${esc(i.unit)})</li>`).join("")}</ul>${o.notes?`<div class="mut">📝 ${esc(o.notes)}</div>`:""}<b>Total estimado: ${money(o.total)}</b></div>`).join("")||`<div class="pn empty">Todavía no llegaron pedidos.</div>`)}
const CF=[["nombre","Nombre del supermercado","text"],["logo_url","Logo","image"],["banner_url","Banner principal (imagen de fondo de la portada)","image",{w:1}],["bienvenida_titulo","Mensaje de bienvenida (título)","text",{w:1}],["bienvenida_texto","Texto de presentación","textarea",{w:1}],["direccion","Dirección","text"],["telefono","Teléfono fijo","text"],["whatsapp","WhatsApp (con código de país, ej: 59895605552)","text"],["horarios","Horarios de atención","textarea"],["instagram","Instagram (URL)","text"],["facebook","Facebook (URL)","text"],["mapsEmbed","Google Maps (URL del «src» del iframe)","text",{w:1}],["categorias","Categorías (una por línea: emoji + nombre)","textarea",{w:1,rows:8}]];
function conf(){const c={...D.conf};if(!c.categorias)c.categorias=DEFCATS;return `<div class="hd"><h2>Configuración de la tienda</h2></div><form class="sf" id="cf">${formHTML(CF,c)}<div class="w"><button class="btn red">Guardar cambios</button></div></form>`}
function bind(){
  document.querySelectorAll("[data-new]").forEach(b=>b.onclick=()=>{const p=b.dataset.new==="p";
    openForm(p?"Nuevo producto":"Nueva oferta",p?PF():OF,p?{active:true,unit:"unidad"}:{active:true,tag:"Oferta",emoji:"🏷️"},o=>q(sb.from(p?"products":"offers").insert(o)))});
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{const p=b.dataset.edit==="p",r=(p?D.products:D.offers).find(x=>x.id===b.dataset.id);
    openForm(p?"Editar producto":"Editar oferta",p?PF():OF,r,o=>q(sb.from(p?"products":"offers").update(o).eq("id",r.id)))});
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const p=b.dataset.del==="p",r=(p?D.products:D.offers).find(x=>x.id===b.dataset.id);del(p?"products":"offers",r.id,r.name||r.title)});
  document.querySelectorAll("input[data-t]").forEach(i=>i.onchange=()=>patch(i.dataset.t,i.dataset.id,{[i.dataset.k]:i.checked}));
  document.querySelectorAll("select[data-os]").forEach(s=>s.onchange=()=>patch("orders",s.dataset.os,{status:s.value}));
  const f=$("#cf");if(f)f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector(".red");b.disabled=true;
    try{const o=await collect(f,CF,D.conf);await q(sb.from("settings").upsert({id:1,data:o}));await load();render();toast("Configuración guardada ✔")}catch(er){toast("Error: "+er.message,1)}b.disabled=false}}
</script>
</body>
</html>
